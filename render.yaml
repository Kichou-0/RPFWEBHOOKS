# Déploiement sur Render : « New > Blueprint » puis choisis ce dépôt.
services:
  - type: web
    name: k13-stock
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: k13-stock-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
databases:
  - name: k13-stock-db
    plan: basic-256mb
