# Déploiement en un clic sur Render : « New > Blueprint » puis choisis ce dépôt.
services:
  - type: web
    name: gta-dashboard
    runtime: node
    plan: starter            # le plan gratuit s'endort et perd les webhooks reçus pendant son sommeil
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gta-dashboard-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false           # à saisir dans Render au premier déploiement
databases:
  - name: gta-dashboard-db
    plan: basic-256mb         # le plan gratuit expire au bout de 30 jours
