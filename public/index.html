<!doctype html>
<html lang="fr" data-theme="anthracite">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tableau de bord du groupe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <script>
    // Applique le thème enregistré avant l'affichage pour éviter un flash.
    try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</head>
<body>
  <header class="dock-wrap">
    <div class="dock">
      <div class="menu-anchor">
        <button class="userpill" id="userBtn" aria-haspopup="true" aria-expanded="false">
          <span class="avatar" id="avatar">M</span>
          <span class="uname" id="groupName">Mon groupe</span>
          <span class="ico-s" data-ico="chevron"></span>
        </button>
        <div class="menu" id="menu" hidden>
          <div class="menu-head"><span class="avatar" id="avatar2">M</span><b id="groupName2">Mon groupe</b></div>
          <div id="groupList"></div>
          <div class="menu-sep"></div>
          <div class="menu-row">
            <span class="ico-s" data-ico="palette"></span><span>Thème</span>
            <div class="seg" id="themeSeg">
              <button data-theme="navy">Navy</button>
              <button data-theme="anthracite">Anthracite</button>
              <button data-theme="feutre">Feutre</button>
            </div>
          </div>
          <div id="logoutRow"></div>
        </div>
      </div>
      <span class="sep"></span>
      <nav id="nav" aria-label="Sections">
        <button data-view="overview" data-ico="grid" class="active">Aperçu</button>
        <button data-view="stock" data-ico="box">Coffre</button>
        <button data-view="logs" data-ico="list">Logs</button>
        <button data-view="members" data-ico="users">Membres</button>
        <button data-view="money" data-ico="wallet">Argent</button>
      </nav>
      <span class="sep"></span>
      <span class="live" id="live" title="État de la connexion"><i></i><span>connexion</span></span>
    </div>
  </header>

  <main>
    <div class="page-head">
      <h1 id="pageTitle">Aperçu</h1>
      <p id="pageSub"></p>
    </div>

    <!-- Aperçu -->
    <section id="view-overview" class="view active">
      <div class="stats" id="statsOverview"></div>
      <div class="cols">
        <div class="card">
          <div class="card-h"><span class="tile" data-ico="list"></span><h3>Derniers mouvements</h3></div>
          <div id="recentLogs"></div>
        </div>
        <div class="stack">
          <div class="card">
            <div class="card-h"><span class="tile" data-ico="box"></span><h3>Le coffre en bref</h3></div>
            <div id="shelfBars"></div>
          </div>
          <div class="card">
            <div class="card-h"><span class="tile" data-ico="users"></span><h3>Connectés</h3></div>
            <div id="onlineList"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Coffre -->
    <section id="view-stock" class="view">
      <div class="toolbar">
        <label class="field search"><span class="ico-s" data-ico="search"></span><input id="stockSearch" type="search" placeholder="Chercher un item" aria-label="Chercher un item" /></label>
        <select id="stockSort" class="field" aria-label="Tri">
          <option value="count">Plus grosses quantités</option>
          <option value="label">Ordre alphabétique</option>
        </select>
        <span class="summary" id="stockSummary"></span>
      </div>
      <div class="pills" id="shelves" role="tablist"></div>
      <div id="stockGrid"></div>
    </section>

    <!-- Logs -->
    <section id="view-logs" class="view">
      <div class="toolbar">
        <label class="field search"><span class="ico-s" data-ico="search"></span><input id="logSearch" type="search" placeholder="Chercher un joueur, un item, un message" aria-label="Chercher dans les logs" /></label>
        <div class="seg" id="logSeg">
          <button data-f="" class="on">Tout</button>
          <button data-f="deposit">Dépôts</button>
          <button data-f="withdraw">Retraits</button>
          <button data-f="other">Autres</button>
        </div>
      </div>
      <div class="card flush" id="logTable"></div>
    </section>

    <!-- Membres -->
    <section id="view-members" class="view">
      <div id="memberGrid"></div>
    </section>

    <!-- Argent -->
    <section id="view-money" class="view">
      <div class="stats" id="statsMoney"></div>
      <div class="card">
        <div class="card-h"><span class="tile" data-ico="wallet"></span><h3>Évolution</h3></div>
        <div class="chartbox"><canvas id="moneyChart"></canvas></div>
      </div>
    </section>
  </main>

  <footer>© 2026 Tableau de bord du groupe, données en direct depuis le serveur</footer>

  <script src="/app.js"></script>
</body>
</html>
